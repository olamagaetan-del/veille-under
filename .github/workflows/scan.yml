name: Scan UNDER live

on:
  schedule:
    - cron: "*/5 * * * *"   # toutes les 5 min (minimum GitHub) ; hors créneau le script s'arrête aussitôt
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: veille-under
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      TZ: Africa/Douala   # heure du Cameroun (UTC+1, sans heure d'été)
      NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      CLAUDE_ROUTINE_URL: ${{ secrets.CLAUDE_ROUTINE_URL }}
      CLAUDE_ROUTINE_TOKEN: ${{ secrets.CLAUDE_ROUTINE_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Scanner les matchs en direct
        run: python3 cloud_scan.py
      - name: Sauvegarder les alertes déjà traitées
        run: |
          git config user.name "veille-under-bot"
          git config user.email "actions@users.noreply.github.com"
          git add alertes.json 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "alertes $(date +%H:%M)" && git pull --rebase && git push)
