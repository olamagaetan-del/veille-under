name: Plan des matchs du jour

on:
  schedule:
    - cron: "10 5 * * *"   # 05:10 UTC = 06:10 à Yaoundé, toute l'année
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: veille-under
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TZ: Africa/Douala   # heure du Cameroun (UTC+1, sans heure d'été)
      NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
    steps:
      - uses: actions/checkout@v4
      - name: Établir le plan de la journée
        run: python3 cloud_plan.py
      - name: Enregistrer le plan
        run: |
          git config user.name "veille-under-bot"
          git config user.email "actions@users.noreply.github.com"
          git add plan_actif.json plans/
          git diff --cached --quiet || (git commit -m "plan du $(date +%d/%m)" && git pull --rebase && git push)
